<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | Task Manager</title>
  <style>
    :root {
      --bg: #eef2f1;
      --surface: #ffffff;
      --ink: #16231f;
      --muted: #5b6b66;
      --line: #cbd6d2;
      --accent: #0f5f57;
      --accent-hover: #0b4a44;
      --error: #b3261e;
      --error-bg: #fbeceb;
      --ok-bg: #e5f2ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1816;
        --surface: #17231f;
        --ink: #e6efec;
        --muted: #9db0aa;
        --line: #2c3d38;
        --accent: #4fb3a6;
        --accent-hover: #6cc7ba;
        --error: #ff8a80;
        --error-bg: #3a1f1d;
        --ok-bg: #1b3530;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
      line-height: 1.7;
    }

    .panel {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 36px 32px 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    /* チェックリストをイメージした小さなマーク */
    .brand-mark {
      width: 32px;
      height: 32px;
      border: 2px solid var(--accent);
      border-radius: 6px;
      position: relative;
      flex: none;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 3px;
      width: 8px;
      height: 15px;
      border: solid var(--accent);
      border-width: 0 3px 3px 0;
      transform: rotate(40deg);
    }
    .brand-name { font-size: 1.05rem; font-weight: 700; letter-spacing: .02em; }

    h1 { margin: 0 0 4px; font-size: 1.5rem; line-height: 1.4; }
    .lead { margin: 0 0 24px; color: var(--muted); font-size: .9rem; }

    .notice {
      margin: 0 0 20px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: .875rem;
    }
    .notice.error { background: var(--error-bg); color: var(--error); }
    .notice.ok { background: var(--ok-bg); color: var(--accent); }

    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-size: .875rem; font-weight: 600; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 12px;
      font: inherit;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    input:focus-visible, button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    button {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) { button { color: #0f1816; } }
    button:hover { background: var(--accent-hover); }

    .foot { margin: 22px 0 0; font-size: .875rem; color: var(--muted); }
    .foot a { color: var(--accent); }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Task Manager</span>
    </div>

    <h1>ログイン</h1>
    <p class="lead">ユーザー名とパスワードを入力してください。</p>

    <!-- ログイン失敗時（/login?error） -->
    <p class="notice error" th:if="${param.error}" role="alert">
      ユーザー名またはパスワードが正しくありません。
    </p>
    <!-- ログアウト後（/login?logout） -->
    <p class="notice ok" th:if="${param.logout}" role="status">
      ログアウトしました。
    </p>

    <form th:action="@{/login}" method="post">
      <div class="field">
        <label for="username">ユーザー名</label>
        <input type="text" id="username" name="username"
               autocomplete="username" autofocus required>
      </div>

      <div class="field">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required>
      </div>

      <button type="submit">ログイン</button>
    </form>

    <p class="foot">アカウントをお持ちでない場合は <a th:href="@{/register}">新規登録</a></p>
  </main>
</body>
</html>
